<!doctype html><html><head><meta charset="utf-8">
<script src="common.js"></script>
<style>
html,body{width:1920px;height:216px}
#row{position:absolute;inset:0;display:flex;align-items:stretch}
.bk{position:relative;display:flex;align-items:center;justify-content:center;gap:26px;padding:0 26px;text-align:center;overflow:hidden}
.sep{width:2px;align-self:center;height:132px;background:linear-gradient(transparent,var(--ac),transparent);opacity:.45}
.stack{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.blk{display:inline-block;width:max-content;text-align:center}
.t{color:var(--ac);font-weight:800}
.circ{width:170px;height:170px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 6px var(--bg),0 0 0 8px var(--ac)}
.circ img{width:100%;height:100%;object-fit:cover}
svg.bg{position:absolute;left:0;top:0}
</style></head><body>
<div id="row"></div>
<script>
(function () {
  const { S, M, rich, lines, arr, asset, hearts, fitAll, qa } = window.T;
  T.injectBase();
  const Bspec = S.barra || {};
  const blocos = Bspec.blocos || [];
  const row = document.getElementById('row');
  const widths = Bspec.larguras || (blocos.length === 3 ? [640, 700, 580] : blocos.length === 2 ? [1000, 920] : [1920]);
  const blk = (txt, size, maxW, maxH, min, css) => `<div class="blk" data-qa="texto" data-fit="${maxW},${maxH},${min}" style="font-size:${size}px;line-height:1.18;${css || ''}">${lines(txt)}</div>`;
  const icon = asset(M.icone);

  blocos.forEach((b, i) => {
    const w = widths[i] || 600;
    if (i > 0) row.insertAdjacentHTML('beforeend', '<div class="sep"></div>');
    let h = '';
    const inner = w - 60;
    if (b.tipo === 'texto') {
      h = `<div class="stack">${b.titulo ? blk(b.titulo, 36, inner, 50, 22, 'color:var(--ac);font-weight:800') : ''}${blk(b.texto, 25, inner, 112, 17)}</div>`;
    } else if (b.tipo === 'premio' || b.tipo === 'imagem_texto') {
      const img = b.imagem ? `<div class="circ" data-qa="midia"><img src="${asset(b.imagem)}" style="object-position:${b.posicao || '50% 50%'}"></div>` : '';
      const tw = inner - (img ? 200 : 0);
      h = `${img}<div class="stack">${blk(b.titulo, 36, tw, 92, 20, 'color:var(--ac);font-weight:800')}${b.texto ? blk(b.texto, 23, tw, 60, 16) : ''}${b.logo ? `<img src="${asset(b.logo)}" style="max-height:${b.texto ? 40 : 56}px;max-width:${tw}px;margin-top:6px">` : ''}</div>`;
    } else if (b.tipo === 'cta') {
      const bg = (M.motivo === 'coracoes') ? `<svg class="bg" width="${w}" height="216">${hearts(w / 2, 96, 9, 12.5, 3.6, 0.15, 0.55)}</svg>` : '';
      const sel = b.selo ? `<div style="display:inline-flex;align-items:center;margin-top:8px">${icon ? `<img src="${icon}" style="height:48px;margin-right:-6px;position:relative;z-index:2">` : ''}<span class="pill" style="font-size:22px;padding:7px 22px 8px;${icon ? 'border-radius:0 8px 8px 0' : ''}">${rich(b.selo)}</span></div>` : '';
      h = `${bg}<div class="stack" style="position:relative;gap:0">${blk(b.linha1 || 'Saiba mais', 50, inner, 58, 28, 'font-weight:400;color:var(--tx)')}${blk(b.linha2 || '[[na recepção]]', 60, inner, 66, 30, 'font-weight:800;color:var(--ac)')}${sel}</div>`;
    }
    row.insertAdjacentHTML('beforeend', `<div class="bk" style="width:${w}px;flex:none">${h}</div>`);
  });

  async function init() {
    await T.loadFonts();
    fitAll(document);
    window.__qa = () => qa('barra', document.body, 1920, 216);
    window.__ready = true;
  }
  if (document.readyState === 'complete') init(); else window.addEventListener('load', init);
})();
</script></body></html>
